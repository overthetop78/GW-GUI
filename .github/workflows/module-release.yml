name: Build emulation module package

on:
  workflow_dispatch:
    inputs:
      module:
        description: Module id from src/GWGUI.Emulation.*/module.json
        required: true
        type: string
  push:
    tags:
      - module-*-v*

permissions:
  contents: write

concurrency:
  group: module-catalog-publication-${{ inputs.module || github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Resolve module version
        shell: pwsh
        env:
          REQUESTED_MODULE: ${{ inputs.module }}
        run: |
          . .\scripts\emulation-modules.ps1
          $definitions = @(Get-GwGuiEmulationModules -RepositoryRoot (Resolve-Path .))
          if ("${{ github.event_name }}" -eq 'push') {
            if ($env:GITHUB_REF_NAME -notmatch '^module-([A-Za-z0-9][A-Za-z0-9._-]*)-v(\d+\.\d+\.\d+)$') {
              throw "Unsupported module tag: $env:GITHUB_REF_NAME"
            }
            $moduleId = $Matches[1]
            $tagVersion = $Matches[2]
          } else {
            $moduleId = $env:REQUESTED_MODULE
            $tagVersion = $null
          }
          $definition = Resolve-GwGuiEmulationModule -Modules $definitions -Module $moduleId
          $manifest = $definition.Manifest
          if ($tagVersion -and $tagVersion -ne $manifest.moduleVersion) {
            throw "Tag version $tagVersion does not match manifest version $($manifest.moduleVersion)."
          }
          "MODULE_ID=$($definition.Id)" >> $env:GITHUB_ENV
          "MODULE_NAME=$($definition.Name)" >> $env:GITHUB_ENV
          "MODULE_VERSION=$($manifest.moduleVersion)" >> $env:GITHUB_ENV
          "MODULE_NOTES=.github/release-notes/modules/$($definition.Id)/v$($manifest.moduleVersion).md" >> $env:GITHUB_ENV
          "MODULE_ARCHIVE=dist/GW-GUI-Module-$($definition.Id)-$($manifest.moduleVersion)-win-x64.zip" >> $env:GITHUB_ENV
          "MODULE_RELEASE_TAG=module-$($definition.Id)-v$($manifest.moduleVersion)" >> $env:GITHUB_ENV
          "MODULE_CATALOG_TAG=module-$($definition.Id)-catalog" >> $env:GITHUB_ENV
      - name: Run GW GUI tests
        shell: pwsh
        run: |
          $env:DOTNET_CLI_UI_LANGUAGE = 'en-US'
          dotnet test .\tests\GWGUI.Tests\GWGUI.Tests.csproj --configuration Release --logger "console;verbosity=normal"
          if ($LASTEXITCODE -ne 0) { throw 'GW GUI tests failed.' }
      - name: Build module archive
        shell: pwsh
        run: .\scripts\package-module.ps1 -Module $env:MODULE_ID -Configuration Release
      - name: Verify module archive and checksum
        shell: pwsh
        run: |
          $checksum = "$env:MODULE_ARCHIVE.sha256"
          $archiveMissing = -not (Test-Path -LiteralPath $env:MODULE_ARCHIVE -PathType Leaf)
          $checksumMissing = -not (Test-Path -LiteralPath $checksum -PathType Leaf)
          if ($archiveMissing -or $checksumMissing) {
            throw 'Module archive or checksum is missing.'
          }
          $expected = ((Get-Content -LiteralPath $checksum -Raw).Trim() -split '\s+')[0]
          $actual = (Get-FileHash -LiteralPath $env:MODULE_ARCHIVE -Algorithm SHA256).Hash
          if ($actual -ine $expected) { throw 'Module archive checksum verification failed.' }
      - name: Download existing update catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download $env:MODULE_CATALOG_TAG --pattern update-catalog.json --dir .\dist\existing-catalog
          if ($LASTEXITCODE -ne 0) {
            Remove-Item -LiteralPath .\dist\existing-catalog -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "No existing catalog found for $env:MODULE_ID; creating the first one."
            $global:LASTEXITCODE = 0
          }
      - name: Build and validate update catalog
        shell: pwsh
        run: .\scripts\build-update-catalog.ps1 -Scope Module -Module $env:MODULE_ID -Repository '${{ github.repository }}' -ModuleTag $env:MODULE_RELEASE_TAG -ExistingCatalog .\dist\existing-catalog\update-catalog.json
      - uses: actions/upload-artifact@v6
        with:
          name: GW-GUI-Module-${{ env.MODULE_ID }}-${{ env.MODULE_VERSION }}-win-x64
          path: |
            ${{ env.MODULE_ARCHIVE }}
            ${{ env.MODULE_ARCHIVE }}.sha256
            dist/update-catalog.json
          if-no-files-found: error
      - name: Publish tagged module release
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if (-not (Test-Path -LiteralPath $env:MODULE_NOTES -PathType Leaf)) {
            throw "Module release notes are missing: $env:MODULE_NOTES"
          }
          gh release create $env:GITHUB_REF_NAME $env:MODULE_ARCHIVE "$env:MODULE_ARCHIVE.sha256" --verify-tag --latest=false --title "GW GUI $env:MODULE_NAME module $env:MODULE_VERSION" --notes-file $env:MODULE_NOTES
      - name: Publish validated update catalog
        if: github.event_name == 'push'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view $env:MODULE_CATALOG_TAG
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:MODULE_CATALOG_TAG --title "GW GUI $env:MODULE_NAME module catalog" --notes 'Machine-readable module update catalog.' --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create the module catalog release.' }
          gh release upload $env:MODULE_CATALOG_TAG .\dist\update-catalog.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the module catalog.' }
