name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v
        required: true
        default: 0.1.0
      notes_file:
        description: Release notes Markdown file
        required: false
      publication_type:
        description: GitHub release type
        required: true
        type: choice
        options:
          - latest
          - prerelease
          - none
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Normalize tag version
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build packages
        shell: pwsh
        run: .\scripts\package.ps1 -Version $env:PACKAGE_VERSION
      - name: Validate wiki sources
        shell: pwsh
        run: .\scripts\build-wiki.ps1
      - name: Audit packaged application accessibility
        shell: pwsh
        run: .\scripts\test-app-accessibility.ps1 -ApplicationPath ".\dist\portable\GW GUI\gwgui.exe"
      - name: Smoke-test installer in English
        shell: pwsh
        run: .\scripts\test-installer.ps1 -SetupPath ".\dist\GW-GUI-$env:PACKAGE_VERSION-win-x64-setup.exe" -ExpectedVersion $env:PACKAGE_VERSION -InstallerLanguage english
      - name: Smoke-test installer in French
        shell: pwsh
        run: .\scripts\test-installer.ps1 -SetupPath ".\dist\GW-GUI-$env:PACKAGE_VERSION-win-x64-setup.exe" -ExpectedVersion $env:PACKAGE_VERSION -InstallerLanguage french
      - name: Smoke-test upgrade from a legacy self-contained installation
        shell: pwsh
        run: .\scripts\test-installer-upgrade.ps1 -CurrentSetupPath ".\dist\GW-GUI-$env:PACKAGE_VERSION-win-x64-setup.exe" -CurrentVersion $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v6
        with:
          name: GW-GUI-${{ env.PACKAGE_VERSION }}-win-x64
          path: |
            dist/GW-GUI-*.zip
            dist/GW-GUI-*.exe
            dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/GW-GUI-*.zip dist/GW-GUI-*.exe dist/SHA256SUMS.txt --verify-tag --generate-notes
      - name: Publish requested GitHub release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes_file }}
          PUBLICATION_TYPE: ${{ inputs.publication_type }}
        run: |
          $tag = switch ($env:PUBLICATION_TYPE) {
            'prerelease' { "v$env:PACKAGE_VERSION-snapshot" }
            default { "v$env:PACKAGE_VERSION" }
          }
          $title = switch ($env:PUBLICATION_TYPE) {
            'latest' { "GW GUI $env:PACKAGE_VERSION Release" }
            'prerelease' { "GW GUI $env:PACKAGE_VERSION Snapshot" }
            'none' { "GW GUI $env:PACKAGE_VERSION" }
            default { throw "Unsupported publication type: $env:PUBLICATION_TYPE" }
          }
          $arguments = @(
            'release', 'create', $tag,
            'dist/GW-GUI-*.zip',
            'dist/GW-GUI-*.exe',
            'dist/SHA256SUMS.txt',
            '--title', $title
          )
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            $arguments += '--generate-notes'
          } else {
            $arguments += @('--notes-file', $env:RELEASE_NOTES)
          }
          switch ($env:PUBLICATION_TYPE) {
            'latest' { $arguments += '--latest' }
            'prerelease' { $arguments += @('--prerelease', '--latest=false') }
            'none' { $arguments += '--latest=false' }
            default { throw "Unsupported publication type: $env:PUBLICATION_TYPE" }
          }
          gh @arguments
