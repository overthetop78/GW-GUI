name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v
        required: true
        default: 0.1.0
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  package:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Normalize tag version
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
      - name: Restore and test
        shell: pwsh
        run: |
          dotnet restore GWGUI.sln
          dotnet test tests/GWGUI.Tests/GWGUI.Tests.csproj -c Release --no-restore
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build packages
        shell: pwsh
        run: .\scripts\package.ps1 -Version $env:PACKAGE_VERSION
      - name: Validate localized guide images
        shell: pwsh
        run: .\scripts\test-guide-images.ps1 -PublishedDocumentationPath ".\artifacts\publish\win-x64\Documentation"
      - name: Audit packaged application accessibility
        shell: pwsh
        run: .\scripts\test-app-accessibility.ps1 -ApplicationPath ".\artifacts\portable\GW GUI\GW GUI.exe"
      - name: Smoke-test installer in English
        shell: pwsh
        run: .\scripts\test-installer.ps1 -SetupPath ".\artifacts\GW-GUI-$env:PACKAGE_VERSION-win-x64-setup.exe" -ExpectedVersion $env:PACKAGE_VERSION -InstallerLanguage english
      - name: Smoke-test installer in French
        shell: pwsh
        run: .\scripts\test-installer.ps1 -SetupPath ".\artifacts\GW-GUI-$env:PACKAGE_VERSION-win-x64-setup.exe" -ExpectedVersion $env:PACKAGE_VERSION -InstallerLanguage french
      - name: Smoke-test installer upgrade
        shell: pwsh
        run: .\scripts\test-installer-upgrade.ps1 -CurrentSetupPath ".\artifacts\GW-GUI-$env:PACKAGE_VERSION-win-x64-setup.exe" -CurrentVersion $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v6
        with:
          name: GW-GUI-${{ env.PACKAGE_VERSION }}-win-x64
          path: |
            artifacts/GW-GUI-*.zip
            artifacts/GW-GUI-*.exe
            artifacts/SHA256SUMS.txt
          if-no-files-found: error
      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME artifacts/GW-GUI-*.zip artifacts/GW-GUI-*.exe artifacts/SHA256SUMS.txt --verify-tag --generate-notes
