name: Build release packages

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v
        required: true
        default: 0.1.0
      notes_file:
        description: Release notes Markdown file
        required: false
      publication_type:
        description: GitHub release type
        required: true
        type: choice
        options:
          - latest
          - prerelease
          - none
  push:
    tags: ['v*']

permissions:
  contents: write

concurrency:
  group: application-catalog-publication
  cancel-in-progress: false

jobs:
  package:
    runs-on: windows-latest
    env:
      VERSION: ${{ inputs.version || github.ref_name }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x
      - name: Normalize tag version
        shell: pwsh
        run: |
          $version = $env:VERSION.TrimStart('v')
          "PACKAGE_VERSION=$version" >> $env:GITHUB_ENV
          if ("${{ github.event_name }}" -eq 'push') {
            $releaseTag = $env:GITHUB_REF_NAME
          } elseif ("${{ inputs.publication_type }}" -eq 'prerelease') {
            $releaseTag = "v$version-snapshot"
          } else {
            $releaseTag = "v$version"
          }
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
      - name: Run GW GUI tests
        shell: pwsh
        run: |
          $env:DOTNET_CLI_UI_LANGUAGE = 'en-US'
          $testOutput = @(& dotnet test .\tests\GWGUI.Tests\GWGUI.Tests.csproj --configuration Release --logger "console;verbosity=normal" 2>&1)
          $testExitCode = $LASTEXITCODE
          $testOutput | ForEach-Object { Write-Host $_ }
          if ($testExitCode -ne 0) { throw 'GW GUI tests failed.' }

          $summary = [string]::Join("`n", $testOutput)
          $testCounts = [regex]::Matches($summary, '(?im)(?:^|,)\s*Total(?: tests)?\s*:\s*(\d+)')
          $executed = ($testCounts | ForEach-Object { [int]$_.Groups[1].Value } | Measure-Object -Sum).Sum
          if ($testCounts.Count -eq 0 -or $executed -le 0) {
            throw 'No GW GUI test was executed.'
          }
      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress
      - name: Build packages
        shell: pwsh
        run: .\scripts\package.ps1 -Version $env:PACKAGE_VERSION
      - name: Download existing update catalog
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Path .\dist -Force | Out-Null
          gh release download application-catalog --pattern update-catalog.json --dir .\dist\existing-catalog
          if ($LASTEXITCODE -ne 0) { Remove-Item -LiteralPath .\dist\existing-catalog -Recurse -Force -ErrorAction SilentlyContinue }
      - name: Build and validate update catalog
        shell: pwsh
        run: .\scripts\build-update-catalog.ps1 -Scope Application -Version $env:PACKAGE_VERSION -ApplicationTag $env:RELEASE_TAG -Repository ${{ github.repository }} -ExistingCatalog .\dist\existing-catalog\update-catalog.json
      - name: Validate wiki sources
        shell: pwsh
        run: .\scripts\build-wiki.ps1
      - name: Smoke-test installer in English
        shell: pwsh
        run: .\scripts\test-installer.ps1 -SetupPath ".\dist\GW-GUI-$env:PACKAGE_VERSION-win-x64-setup.exe" -ExpectedVersion $env:PACKAGE_VERSION -InstallerLanguage english
      - name: Smoke-test installer in French
        shell: pwsh
        run: .\scripts\test-installer.ps1 -SetupPath ".\dist\GW-GUI-$env:PACKAGE_VERSION-win-x64-setup.exe" -ExpectedVersion $env:PACKAGE_VERSION -InstallerLanguage french
      - name: Smoke-test upgrade from a legacy self-contained installation
        shell: pwsh
        run: .\scripts\test-installer-upgrade.ps1 -CurrentSetupPath ".\dist\GW-GUI-$env:PACKAGE_VERSION-win-x64-setup.exe" -CurrentVersion $env:PACKAGE_VERSION
      - uses: actions/upload-artifact@v6
        with:
          name: GW-GUI-${{ env.PACKAGE_VERSION }}-win-x64
          path: |
            dist/GW-GUI-*-win-x64-portable.zip
            dist/GW-GUI-*-win-x64-setup.exe
            dist/SHA256SUMS.txt
            dist/update-catalog.json
          if-no-files-found: error
      - name: Publish GitHub release for tag
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create $env:GITHUB_REF_NAME dist/GW-GUI-*-win-x64-portable.zip dist/GW-GUI-*-win-x64-setup.exe dist/SHA256SUMS.txt --verify-tag --generate-notes
      - name: Publish requested GitHub release
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: ${{ inputs.notes_file }}
          PUBLICATION_TYPE: ${{ inputs.publication_type }}
        run: |
          $tag = switch ($env:PUBLICATION_TYPE) {
            'prerelease' { "v$env:PACKAGE_VERSION-snapshot" }
            default { "v$env:PACKAGE_VERSION" }
          }
          $title = switch ($env:PUBLICATION_TYPE) {
            'latest' { "GW GUI $env:PACKAGE_VERSION Release" }
            'prerelease' { "GW GUI $env:PACKAGE_VERSION Snapshot" }
            'none' { "GW GUI $env:PACKAGE_VERSION" }
            default { throw "Unsupported publication type: $env:PUBLICATION_TYPE" }
          }
          $arguments = @(
            'release', 'create', $tag,
            'dist/GW-GUI-*-win-x64-portable.zip',
            'dist/GW-GUI-*-win-x64-setup.exe',
            'dist/SHA256SUMS.txt',
            '--title', $title
          )
          if ([string]::IsNullOrWhiteSpace($env:RELEASE_NOTES)) {
            $arguments += '--generate-notes'
          } else {
            $arguments += @('--notes-file', $env:RELEASE_NOTES)
          }
          switch ($env:PUBLICATION_TYPE) {
            'latest' { $arguments += '--latest' }
            'prerelease' { $arguments += @('--prerelease', '--latest=false') }
            'none' { $arguments += '--latest=false' }
            default { throw "Unsupported publication type: $env:PUBLICATION_TYPE" }
          }
          gh @arguments
      - name: Publish validated update catalog
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.publication_type != 'prerelease')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view application-catalog
          if ($LASTEXITCODE -ne 0) {
            gh release create application-catalog --title 'GW GUI application catalog' --notes 'Machine-readable application update catalog.' --latest=false
          }
          if ($LASTEXITCODE -ne 0) { throw 'Unable to create the component catalog release.' }
          gh release upload application-catalog .\dist\update-catalog.json --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Unable to publish the component catalog.' }
